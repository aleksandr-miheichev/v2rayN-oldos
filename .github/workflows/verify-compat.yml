name: verify compatibility with older systems

# Release gate. Nothing is uploaded to a release until every job here is green,
# because a broken artifact that is already public cannot be un-published.
#
# Three independent things are proven:
#   1. the managed code still builds and its unit tests pass;
#   2. no shipped binary declares a glibc requirement above the promised
#      baseline (catches a regression before anything is executed);
#   3. the real package installs and the real application starts on the oldest
#      systems this fork supports, resolved by those systems' own loaders.

on:
  workflow_call:
    inputs:
      glibc_baseline:
        description: Highest glibc symbol version any shipped binary may require.
        required: false
        type: string
        default: '2.34'

permissions:
  contents: read
  actions: read

jobs:
  unit-tests:
    name: unit tests
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with: { fetch-depth: '1' }

      - name: Setup .NET
        uses: actions/setup-dotnet@v6.0.0
        with: { dotnet-version: '10.0.1xx' }

      - name: Run tests
        run: dotnet test v2rayN/ServiceLib.Tests/ServiceLib.Tests.csproj -c Release --nologo

  abi-baseline:
    name: ABI baseline of shipped binaries
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with: { fetch-depth: '1' }

      - name: Download the built Debian packages
        uses: actions/download-artifact@v8
        with: { name: release-deb, path: dist }

      - name: Unpack the amd64 package
        shell: bash
        run: |
          set -euo pipefail
          deb="$(find dist -name 'v2rayN-linux-64.deb' -print -quit)"
          [[ -n "$deb" ]] || { echo "v2rayN-linux-64.deb not found in the artifact"; exit 1; }
          mkdir -p unpacked
          dpkg-deb -x "$deb" unpacked

      - name: Check the glibc baseline
        shell: bash
        run: |
          chmod 755 scripts/fork/check-abi-baseline.sh
          ./scripts/fork/check-abi-baseline.sh unpacked '${{ inputs.glibc_baseline }}'

  deb-install:
    name: install and launch on ${{ matrix.image }}
    runs-on: ubuntu-24.04
    container: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        image: [ 'ubuntu:22.04', 'debian:12' ]
    steps:
      - name: Prepare the container
        shell: bash
        env: { DEBIAN_FRONTEND: noninteractive }
        run: |
          set -euo pipefail
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates xvfb procps findutils

      - name: Download the built Debian packages
        uses: actions/download-artifact@v8
        with: { name: release-deb, path: dist }

      - name: Install the package
        shell: bash
        env: { DEBIAN_FRONTEND: noninteractive }
        run: |
          set -euo pipefail
          deb="$(find dist -name 'v2rayN-linux-64.deb' -print -quit)"
          [[ -n "$deb" ]] || { echo "v2rayN-linux-64.deb not found in the artifact"; exit 1; }
          apt-get update
          # Fails here when a declared dependency floor is higher than this
          # distribution can satisfy, which is one half of the bug being guarded.
          apt-get install -y "$(readlink -f "$deb")"

      - name: Resolve every shipped symbol with this system's loader
        shell: bash
        run: |
          set -uo pipefail
          fail=0
          while IFS= read -r -d '' lib; do
            out="$(ldd -r "$lib" 2>&1)" || true
            if grep -qE 'not found|undefined symbol' <<<"$out"; then
              fail=1
              echo "::error::unresolved references in ${lib}"
              echo "$out" | grep -E 'not found|undefined symbol' | head -20
            fi
          done < <(find /opt/v2rayN -maxdepth 1 -type f -name '*.so' -print0)
          if [[ "$fail" -ne 0 ]]; then
            echo "The dynamic loader on this system cannot satisfy the shipped binaries."
            exit 1
          fi
          echo "All shipped shared objects resolve on this system."

      - name: Start the application headless
        shell: bash
        run: |
          set -uo pipefail
          timeout --signal=TERM 40 xvfb-run -a /usr/bin/v2rayn >/tmp/v2rayn.log 2>&1
          rc=$?
          echo "exit code: $rc"
          echo "--- output ---"; tail -n 60 /tmp/v2rayn.log || true
          if grep -qiE 'GLIBC_|DllNotFoundException|Unable to load shared library|Unhandled exception' /tmp/v2rayn.log; then
            echo "::error::the application failed to start on ${{ matrix.image }}"
            exit 1
          fi
          # 124 means it was still running when the timeout killed it, which is
          # the expected outcome for a GUI application that started correctly.
          if [[ "$rc" -ne 124 && "$rc" -ne 0 ]]; then
            echo "::error::the application exited with $rc on ${{ matrix.image }}"
            exit 1
          fi

  rpm-install:
    name: install and launch on rockylinux:9
    runs-on: ubuntu-24.04
    container: rockylinux/rockylinux:9
    steps:
      - name: Prepare the container
        shell: bash
        run: |
          set -euo pipefail
          dnf -y install findutils procps-ng xorg-x11-server-Xvfb

      - name: Download the built RPM packages
        uses: actions/download-artifact@v8
        with: { name: release-rpm, path: dist }

      - name: Install the package
        shell: bash
        run: |
          set -euo pipefail
          rpm_file="$(find dist -name 'v2rayN-linux-rhel-64.rpm' -print -quit)"
          [[ -n "$rpm_file" ]] || { echo "v2rayN-linux-rhel-64.rpm not found in the artifact"; exit 1; }
          dnf -y install "$(readlink -f "$rpm_file")"

      - name: Resolve every shipped symbol with this system's loader
        shell: bash
        run: |
          set -uo pipefail
          fail=0
          while IFS= read -r -d '' lib; do
            out="$(ldd -r "$lib" 2>&1)" || true
            if grep -qE 'not found|undefined symbol' <<<"$out"; then
              fail=1
              echo "::error::unresolved references in ${lib}"
              echo "$out" | grep -E 'not found|undefined symbol' | head -20
            fi
          done < <(find /opt/v2rayN -maxdepth 1 -type f -name '*.so' -print0)
          [[ "$fail" -eq 0 ]] || exit 1
          echo "All shipped shared objects resolve on this system."

      - name: Start the application headless
        shell: bash
        run: |
          set -uo pipefail
          timeout --signal=TERM 40 xvfb-run -a /usr/bin/v2rayn >/tmp/v2rayn.log 2>&1
          rc=$?
          echo "exit code: $rc"
          echo "--- output ---"; tail -n 60 /tmp/v2rayn.log || true
          if grep -qiE 'GLIBC_|DllNotFoundException|Unable to load shared library|Unhandled exception' /tmp/v2rayn.log; then
            echo "::error::the application failed to start on RHEL 9"
            exit 1
          fi
          if [[ "$rc" -ne 124 && "$rc" -ne 0 ]]; then
            echo "::error::the application exited with $rc on RHEL 9"
            exit 1
          fi
