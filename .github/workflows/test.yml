name: Code Test

on:
  pull_request:
    branches:
      - oldos
    paths:
      - 'v2rayN/ServiceLib/Services/CoreConfig/**'
      - 'v2rayN/ServiceLib/Handler/Fmt/**'
      - '.github/workflows/test.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
        submodules: 'recursive'
        fetch-depth: '0'

    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        # Deliberate pin: upstream's SDK band, see build.yml. Upstream still
        # asks for 8.0.x here, which cannot build net10.0 at all (NETSDK1045);
        # the workflow only survives because it runs on pull requests, which
        # this fork never receives. Proposed upstream in 2dust/v2rayN#9975.
        dotnet-version: '10.0.1xx'

    - name: Test Code
      working-directory: ./v2rayN
      run: dotnet run --project ./ServiceLib.Tests -c Release
