name: Code Test

on:
  pull_request:
    branches:
      - oldos
    paths:
      - 'v2rayN/ServiceLib/Services/CoreConfig/**'
      - 'v2rayN/ServiceLib/Handler/Fmt/**'
      - '.github/workflows/test.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
        submodules: 'recursive'
        fetch-depth: '0'

    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        # Deliberate pin: upstream's own value in their PR-test workflow;
        # kept for parity, the real test run is in verify-compat.yml.
        dotnet-version: '8.0.x'

    - name: Test Code
      working-directory: ./v2rayN
      run: dotnet test ./ServiceLib.Tests
