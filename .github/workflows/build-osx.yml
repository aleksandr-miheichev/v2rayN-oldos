name: release macOS

on:
  workflow_dispatch:
    inputs:
      release_tag:
        required: false
        type: string
  push:
    branches:
      - patches

permissions:
  contents: write
  actions: write

jobs:
  build:
    uses: ./.github/workflows/build.yml
    with:
      target: macos

  release-zip:
    if: inputs.release_tag != ''
    # Same gate as the dmg: the zip carries the same application, and opt-in
    # prerelease users auto-update from it before the release is promoted.
    needs: [ build, verify ]
    uses: ./.github/workflows/package-zip.yml
    with:
      target: macos
      release_tag: ${{ inputs.release_tag }}
    secrets: inherit
    
  dmg:
    name: package and release macOS dmg
    if: inputs.release_tag != ''
    needs: build
    strategy:
      matrix:
        arch: [ x64, arm64 ]
    runs-on: macos-latest
    env:
      Arch: |-
        ${{
          case(
            matrix.arch == 'x64', '64',
            matrix.arch
          ) 
        }} 
    steps:
    - name: Checkout
      uses: actions/checkout@v7

    - name: Restore build artifacts
      uses: actions/download-artifact@v8
      with:
        name: ${{ matrix.arch }}
        path: v2rayN-macos-${{ env.Arch }}
    
    - name: Setup create-dmg
      run: |
        # The runner image ships a third-party tap that Homebrew now distrusts
        # and warns about on every command; drop it so the warning stops
        # landing in the release annotations.
        brew untap aws/tap 2>/dev/null || true
        brew install create-dmg

    - name: Ensure script permissions
      run: chmod 755 package-osx.sh

    - name: Package dmg
      run: ./package-osx.sh macos-$Arch v2rayN-macos-$Arch ${{ inputs.release_tag }}

    - name: Upload dmg artifact
      uses: actions/upload-artifact@v7
      with:
        name: release-dmg-${{ matrix.arch }}
        path: v2rayN*.dmg
        if-no-files-found: error

  verify:
    name: verify compatibility with older macOS
    if: inputs.release_tag != ''
    needs: dmg
    uses: ./.github/workflows/verify-macos.yml

  release-dmg:
    name: sign and upload macOS dmg
    if: inputs.release_tag != ''
    needs: [ dmg, verify ]
    strategy:
      matrix:
        arch: [ x64, arm64 ]
    uses: ./.github/workflows/upload-sign.yml
    with:
      release_tag: ${{ inputs.release_tag }}
      artifact_name: release-dmg-${{ matrix.arch }}
      file_pattern: '*.dmg'
    secrets:
      GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}

  nudge-finalize:
    name: ask the finalizer to look now
    if: inputs.release_tag != ''
    needs: [ release-zip, release-dmg ]
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch finalize-release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          # Completion events of token-dispatched runs are never delivered
          # (recursion prevention), so promotion used to wait for a cron tick
          # -- up to half an hour of a complete release sitting as a
          # prerelease. workflow_dispatch is the one event the default token
          # may create, so the build asks the finalizer to look right now.
          gh workflow run finalize-release.yml --ref oldos
