name: sync with upstream
# Part of this fork's release pipeline; the product branch is oldos.

# Keeps this fork current with 2dust/v2rayN.
#
#   master   is a verbatim mirror of upstream and is never patched.
#   patches  carries the fork's granular patch stack, rebased on top of every
#            upstream change; development and conflict resolution happen here.
#   oldos    is the product branch and is REBUILT, not committed to: it is
#            always upstream/master plus exactly ONE squashed commit holding
#            the whole patch tree.
#
# The one-commit shape is deliberate: rebasing a 20-commit stack hourly kept
# republishing all of it with fresh timestamps, so the repository's commit
# page showed a wall of fork maintenance above the author's actual work. Now
# the public history reads as upstream's history plus a single line, and the
# full per-change fork history stays on `patches`.

on:
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch:
  # A push to patches rebuilds oldos within a minute; a push to master lets a
  # just-reviewed workflow change resume the sync without waiting out the
  # hour. The sync's own pushes use GITHUB_TOKEN, whose events start no
  # workflows, so this cannot loop.
  push:
    branches: [ patches, master ]

permissions:
  contents: write
  issues: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

env:
  UPSTREAM: https://github.com/2dust/v2rayN.git
  PATCH_BRANCH: patches
  PRODUCT_BRANCH: oldos
  # This checkout carries a remote named "upstream", which is the name gh
  # prefers when resolving its target repository -- without this pin the
  # issue-filing steps would address 2dust/v2rayN and fail with a 403.
  GH_REPO: ${{ github.repository }}

jobs:
  sync:
    name: rebase the patch stack and rebuild the product branch
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the patch branch
        uses: actions/checkout@v7
        with:
          ref: patches
          fetch-depth: '0'

      - name: Configure git
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

      - name: Fetch upstream
        run: |
          set -euo pipefail
          git remote add upstream "$UPSTREAM" 2>/dev/null || git remote set-url upstream "$UPSTREAM"
          # Upstream tags are deliberately not fetched: this fork publishes its
          # own four-component tags and an upstream tag reachable from the same
          # history would confuse the version stamped into the build.
          git fetch --no-tags upstream master

      - name: Report what arrived
        id: incoming
        run: |
          set -euo pipefail
          count="$(git rev-list --count "${PATCH_BRANCH}..upstream/master" 2>/dev/null || echo 0)"
          echo "count=$count" >> "$GITHUB_OUTPUT"
          echo "New upstream commits: $count"
          # --max-count instead of piping to head: under pipefail, head closing
          # the pipe early would turn a large backlog into a SIGPIPE failure.
          [[ "$count" == "0" ]] || git log --oneline --max-count=30 "${PATCH_BRANCH}..upstream/master"

      # The owner reads every upstream change to .github/workflows before it
      # may run in this repository. The gate is also what lets this sync live
      # without a workflow-scoped credential: GitHub rejects a push that
      # introduces workflow content the repository has not seen at the tip of
      # any branch (issues #14, #15, #16), and the permissions block has no
      # `workflows` key to grant -- so unreviewed CI commits could not be
      # pushed from here anyway. Comparing the mirror to upstream, not just
      # the incoming batch, keeps the gate armed even if an earlier review
      # pushed patches but forgot the mirror.
      - name: Stop for manual review when upstream changed its workflows
        id: gate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          changed="$(git diff --name-only origin/master upstream/master -- .github/workflows/)"
          if [[ -z "$changed" ]]; then
            echo "review=false" >> "$GITHUB_OUTPUT"
            echo "No workflow changes; the sync may proceed on its own."
            exit 0
          fi
          echo "review=true" >> "$GITHUB_OUTPUT"
          printf 'Upstream changed:\n%s\n' "$changed"

          # Fails closed, like every issue-filing step here: an API outage
          # must not be read as "nothing is open" and produce a duplicate.
          if ! existing="$(gh issue list --state open --label workflows-review --json number --jq '.[0].number')"; then
            echo "Could not query open issues; filing nothing rather than risking a duplicate."
            exit 1
          fi
          if [[ -n "$existing" && "$existing" != "null" ]]; then
            echo "Issue #$existing is already waiting for this review."
            exit 0
          fi

          gh label create workflows-review --color FBCA04 \
            --description "Upstream changed its CI; the sync waits for a human review" 2>/dev/null || true

          # Substring, not a pipe through head: pipefail would turn head
          # closing the pipe early into a SIGPIPE failure on a large diff.
          diff_text="$(git diff origin/master upstream/master -- .github/workflows/)"

          body_file="$(mktemp)"
          {
            printf 'Upstream changed files under `.github/workflows/`, and this fork takes such changes only after a human has read them. The hourly sync parks itself until the review lands.\n\n'
            printf 'While this issue is open the fork receives no upstream commits at all -- including any product commits waiting in the same batch.\n\n'
            printf 'To review and resume:\n\n'
            printf '```bash\n'
            printf 'git fetch upstream master\n'
            printf 'git checkout patches\n'
            printf 'git rebase upstream/master\n'
            printf '# read the workflow changes, resolve conflicts if any, then:\n'
            printf 'git push origin upstream/master:master   # the mirror first, or the gate stays armed\n'
            printf 'git push --force-with-lease origin patches\n'
            printf '# the sync rebuilds oldos from patches by itself\n'
            printf '```\n\n'
            printf 'Both pushes need a credential with the workflow scope; the token this sync runs with does not carry it, which is one of the two reasons this gate exists.\n\n'
            printf 'Workflow files upstream touched:\n\n'
            printf '```\n%s\n```\n\n' "$changed"
            printf 'The change itself:\n\n'
            printf '```diff\n'
            printf '%s\n' "${diff_text:0:50000}"
            if [[ "${#diff_text}" -gt 50000 ]]; then
              printf '... (truncated; the full diff is one git diff origin/master upstream/master -- .github/workflows/ away)\n'
            fi
            printf '```\n\n'
            printf 'Upstream commits waiting behind this review:\n\n'
            printf '```\n'
            git log --oneline --max-count=30 "${PATCH_BRANCH}..upstream/master"
            printf '```\n\n'
            printf 'The first green sync run closes this issue automatically.\n'
          } > "$body_file"

          gh issue create --title 'Upstream changed .github/workflows -- review before it syncs' \
            --label workflows-review --body-file "$body_file"
          exit 1

      - name: Update the mirror branch
        if: steps.incoming.outputs.count != '0' && steps.gate.outputs.review != 'true'
        run: |
          set -euo pipefail
          git branch -f master upstream/master
          # Push failures are captured rather than only printed, so the issue
          # this workflow files can name the cause instead of pointing at a log.
          if ! out="$(git push --force-with-lease origin master 2>&1)"; then
            printf '%s\n' "$out" | tee -a "${RUNNER_TEMP}/sync-failure.txt"
            exit 1
          fi
          printf '%s\n' "$out"

      - name: Rebase the patch stack
        id: rebase
        if: steps.gate.outputs.review != 'true'
        run: |
          set -uo pipefail
          # A no-op when upstream has not moved (the push-to-patches trigger).
          if git rebase upstream/master; then
            echo "conflict=false" >> "$GITHUB_OUTPUT"
          else
            echo "conflict=true" >> "$GITHUB_OUTPUT"
            git rebase --abort || true
          fi

      # The failure git cannot report as a conflict. Upstream can drop a
      # dependency the fork's own files rely on without touching a single line
      # they contain, and the rebase then succeeds: that is how the migration
      # to TUnit left this fork's only test file on xunit (issue #17). Nothing
      # compiled the merged tree until the release gate ran -- by then the tag
      # was cut and the release could no longer be completed. Compiling here,
      # before anything is published, is the only thing that sees this class.
      - name: Setup .NET
        if: steps.rebase.outputs.conflict == 'false'
        uses: actions/setup-dotnet@v6
        # Same SDK policy as build.yml: float on the major, ga quality only.
        with: { dotnet-version: '10.x', dotnet-quality: 'ga' }

      - name: Build and run the tests on the rebased tree
        if: steps.rebase.outputs.conflict == 'false'
        run: |
          set -uo pipefail
          if dotnet run --project v2rayN/ServiceLib.Tests/ServiceLib.Tests.csproj -c Release \
               >"${RUNNER_TEMP}/tests.log" 2>&1; then
            tail -n 20 "${RUNNER_TEMP}/tests.log"
            exit 0
          fi
          cat "${RUNNER_TEMP}/tests.log"
          # Only the tail reaches the issue this sync files. A build failure
          # prints far more than the 65536 characters a GitHub issue body
          # accepts, and an over-long body would fail the reporting step
          # itself -- silencing the report for exactly the failure it exists
          # for. The first line is what the reader sees before the output.
          {
            echo 'The patch stack no longer builds or passes its tests on top of upstream.'
            echo
            tail -n 120 "${RUNNER_TEMP}/tests.log" | tail -c 20000
          } >> "${RUNNER_TEMP}/sync-failure.txt"
          exit 1

      - name: Push the rebased patch stack
        if: steps.rebase.outputs.conflict == 'false'
        run: |
          set -euo pipefail
          if [[ "$(git rev-parse HEAD)" == "$(git rev-parse "origin/${PATCH_BRANCH}")" ]]; then
            echo "The patch branch did not move."
          elif ! out="$(git push --force-with-lease origin "HEAD:refs/heads/${PATCH_BRANCH}" 2>&1)"; then
            printf '%s\n' "$out" | tee -a "${RUNNER_TEMP}/sync-failure.txt"
            exit 1
          else
            printf '%s\n' "$out"
          fi

      - name: Rebuild the product branch as upstream plus one commit
        if: steps.rebase.outputs.conflict == 'false'
        run: |
          set -euo pipefail
          # The rebased patch branch's tree IS the product tree, so the product
          # commit is built directly with commit-tree: tree of patches, single
          # parent at upstream's tip. No checkout, nothing to get half-done.
          tree="$(git rev-parse 'HEAD^{tree}')"
          parent="$(git rev-parse upstream/master)"
          current="$(git rev-parse "origin/${PRODUCT_BRANCH}" 2>/dev/null || echo '')"

          # Idempotency guard: without it every run would mint a new commit
          # (same content, fresh timestamp) and force-push it for nothing.
          if [[ -n "$current" ]] \
             && [[ "$(git rev-parse "${current}^{tree}")" == "$tree" ]] \
             && [[ "$(git rev-parse "${current}^" 2>/dev/null || echo '')" == "$parent" ]]; then
            echo "The product branch already equals upstream plus the patch tree."
            exit 0
          fi

          count="$(git rev-list --count "upstream/master..HEAD")"
          new="$(git commit-tree "$tree" -p "$parent" \
            -m 'fork: keep Ubuntu 22.04, Debian 12, RHEL 9 and macOS 13.6 supported' \
            -m "Squashed from the ${count} commits on branch ${PATCH_BRANCH}, where the full per-change history lives. This branch always reads as upstream master plus this one commit.")"
          if ! out="$(git push --force-with-lease origin "${new}:refs/heads/${PRODUCT_BRANCH}" 2>&1)"; then
            printf '%s\n' "$out" | tee -a "${RUNNER_TEMP}/sync-failure.txt"
            exit 1
          fi
          printf '%s\n' "$out"
          echo "Product branch rebuilt: ${new}"

      # A green run that leaves the fork behind is false comfort: every other
      # pipeline stays green while releases ship progressively older code.
      - name: Fail if the product branch is still behind upstream
        if: steps.rebase.outputs.conflict == 'false'
        run: |
          set -euo pipefail
          git fetch -q --no-tags origin "${PRODUCT_BRANCH}"
          behind="$(git rev-list --count "origin/${PRODUCT_BRANCH}..upstream/master")"
          if [[ "$behind" != "0" ]]; then
            printf '%s\n' "The product branch is still ${behind} commits behind upstream after a sync that reported success." \
              | tee -a "${RUNNER_TEMP}/sync-failure.txt"
            exit 1
          fi
          echo "The product branch carries every upstream commit."

      # The issue bodies say "a green run closes this", and doing it by hand
      # was forgotten twice. Reaching this step means the whole chain held:
      # mirror current, stack rebased, product rebuilt, nothing behind --
      # which is exactly the evidence those issues wait for.
      - name: Close resolved sync issues
        if: steps.rebase.outputs.conflict == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          for label in sync-failure upstream-conflict workflows-review; do
            # Fails closed like the filing steps: an API error skips closing
            # rather than guessing; the next green run retries.
            if ! nums="$(gh issue list --state open --label "$label" --json number --jq '.[].number')"; then
              echo "Could not query ${label} issues; leaving them for the next run."
              continue
            fi
            for n in $nums; do
              gh issue close "$n" --comment "Closed automatically: sync run ${{ github.run_id }} completed green -- the mirror, the patch stack and the product branch are all current." \
                || echo "Could not close #$n; the next green run will retry."
            done
          done

      - name: Open an issue when the rebase conflicts
        if: steps.rebase.outputs.conflict == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # One open issue at a time, otherwise every hourly run would file
          # another one for the same conflict. The query is allowed to fail the
          # step rather than being swallowed: treating an API outage as "no
          # issue exists" is what produced duplicates once.
          if ! existing="$(gh issue list --state open --label upstream-conflict --json number --jq '.[0].number')"; then
            echo "Could not query open issues; filing nothing rather than risking a duplicate."
            exit 1
          fi
          if [[ -n "$existing" && "$existing" != "null" ]]; then
            echo "Issue #$existing is already open for this conflict."
            exit 0
          fi
          gh label create upstream-conflict --color B60205 \
            --description "The fork patch stack no longer applies to upstream" 2>/dev/null || true
          body="$(printf '%s\n' \
            'The hourly sync could not rebase the patch stack onto the latest upstream `master`.' \
            '' \
            'Releases are paused until this is resolved, because `oldos` no longer receives the newest upstream commits.' \
            '' \
            'To resolve it locally:' \
            '' \
            '```bash' \
            'git fetch upstream master' \
            'git checkout patches' \
            'git rebase upstream/master' \
            '# resolve, then:' \
            'git push --force-with-lease origin patches' \
            '# the sync rebuilds oldos from patches by itself' \
            '```' \
            '' \
            'Upstream commits waiting to be integrated:' \
            '' )"
          body="${body}$(git log --oneline --max-count=30 "HEAD..upstream/master")"
          gh issue create --title "Upstream rebase conflict" --label upstream-conflict --body "$body"
          exit 1

      # A conflict has its own rich issue above; everything else -- a failed
      # fetch, a refused force-with-lease, a dead runner tool -- used to be a
      # red run nobody watches, while the fork silently froze and releases kept
      # shipping ever-older code. The failure sweep deliberately skips this
      # workflow, so it must speak for itself.
      - name: Report any other failure of this sync
        if: failure() && steps.rebase.outputs.conflict != 'true' && steps.gate.outputs.review != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Fails closed: an API outage must not be read as "nothing is open"
          # and produce a second issue for a failure already reported.
          if ! existing="$(gh issue list --state open --label sync-failure --json number --jq '.[0].number')"; then
            echo "Could not query open issues; filing nothing rather than risking a duplicate."
            exit 1
          fi
          if [[ -n "$existing" && "$existing" != "null" ]]; then
            echo "Issue #$existing is already open for a failing sync."
            exit 0
          fi

          captured="$(cat "${RUNNER_TEMP}/sync-failure.txt" 2>/dev/null || true)"

          # One failure mode deserves its own instructions: no credential
          # without the workflow scope may introduce workflow content the
          # repository has never seen, and the permissions block has no key
          # that grants it. The review gate above stops the sync before any
          # push can trip this, so reaching it means the gate missed a case.
          diagnosis='The log above holds the reason.'
          if grep -q 'without .workflows. permission' <<<"$captured"; then
            diagnosis="$(printf '%s\n' \
              '**Cause: a push introduced workflow content this repository had never seen, and the token this sync runs with may not do that.**' \
              '' \
              'The manual-review gate exists to park the sync before any push carries changes under `.github/workflows/`, so reaching this error means the gate let one through. Unblock the fork by hand (`git push` from a machine whose credentials carry the workflow scope), then work out why the gate did not stop first.')"
          fi

          gh label create sync-failure --color D93F0B \
            --description "The hourly upstream sync is failing for a reason other than a rebase conflict" 2>/dev/null || true
          gh issue create --title "Upstream sync failed (run ${{ github.run_id }})" --label sync-failure --body "$(printf '%s\n' \
            'The hourly sync with upstream failed before reaching a rebase conflict.' \
            '' \
            'While this stays broken, the fork no longer receives upstream commits and releases keep shipping progressively older code -- with every other pipeline green.' \
            '' \
            "${diagnosis}" \
            '' \
            '```' \
            "${captured:-(no output was captured)}" \
            '```' \
            '' \
            'Log: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}' \
            '' \
            'Close this issue once a sync run succeeds.')"
