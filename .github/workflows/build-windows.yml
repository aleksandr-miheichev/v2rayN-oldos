name: release Windows

on:
  workflow_dispatch:
    inputs:
      release_tag:
        required: false
        type: string
  push:
    branches:
      - oldos

permissions:
  contents: write
  actions: write

jobs:
  build:
    uses: ./.github/workflows/build.yml
    with:
      target: windows
      project: ./v2rayN/v2rayN.csproj

  release-zip:
    if: inputs.release_tag != ''
    needs: build
    uses: ./.github/workflows/package-zip.yml
    with:
      target: windows
      release_tag: ${{ inputs.release_tag }}
    secrets: inherit

  nudge-finalize:
    name: ask the finalizer to look now
    if: inputs.release_tag != ''
    needs: [ release-zip ]
    runs-on: ubuntu-24.04
    steps:
      - name: Dispatch finalize-release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          # Completion events of token-dispatched runs are never delivered
          # (recursion prevention), so promotion used to wait for a cron tick
          # -- up to half an hour of a complete release sitting as a
          # prerelease. workflow_dispatch is the one event the default token
          # may create, so the build asks the finalizer to look right now.
          gh workflow run finalize-release.yml --ref oldos
