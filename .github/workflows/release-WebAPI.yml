name: release v2rayN.WebAPI

on:
  workflow_call:
    inputs:
      release_tag:
        required: true
        type: string
    secrets:
      GPG_PRIVATE_KEY:
        required: true
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Fork release tag (for example 7.x.y.1); run this workflow on that tag.'
        required: true
        type: string

permissions:
  contents: write
  actions: write

jobs:
  source:
    name: Verify the immutable release source
    runs-on: ubuntu-24.04
    steps:
      - name: Validate release source
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          RELEASE_REF_TYPE: ${{ github.ref_type }}
          RELEASE_REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [[ "$RELEASE_REF_TYPE" != tag || "$RELEASE_REF_NAME" != "$RELEASE_TAG" ]]; then
            echo "Release builds must run on the matching immutable tag: $RELEASE_TAG" >&2
            exit 1
          fi

  build:
    needs: source
    uses: ./.github/workflows/build-WebAPI.yml
    permissions:
      contents: read
      actions: read
    with:
      release_tag: ${{ inputs.release_tag }}

  release-web-packages:
    name: sign and upload Web API packages
    # Upload through the shared signing flow, exactly like the desktop packages.
    if: inputs.release_tag != ''
    needs: build
    uses: ./.github/workflows/upload-sign.yml
    with:
      release_tag: ${{ inputs.release_tag }}
      artifact_name: WebAPI-release-packages
      file_pattern: 'v2rayN-*-WebAPI*.zip'
    secrets: { GPG_PRIVATE_KEY: "${{ secrets.GPG_PRIVATE_KEY }}" }

  nudge-finalize:
    name: Ask the finalizer to verify this completed release
    needs: [release-web-packages, release-web-manifest]
    runs-on: ubuntu-24.04
    steps:
      - name: Dispatch finalize-release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: gh workflow run finalize-release.yml --ref oldos --field "tag=$RELEASE_TAG"

  release-web-manifest:
    name: sign and upload Web update manifest
    if: inputs.release_tag != ''
    # Advertise the update only after its packages and manifest have been uploaded.
    needs: [build, release-web-packages]
    uses: ./.github/workflows/upload-sign.yml
    with:
      release_tag: ${{ inputs.release_tag }}
      artifact_name: WebAPI-release-manifest
      file_pattern: 'WebAPI-update.json'
    secrets: { GPG_PRIVATE_KEY: "${{ secrets.GPG_PRIVATE_KEY }}" }
