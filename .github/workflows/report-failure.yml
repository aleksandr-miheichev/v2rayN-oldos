# A green run of this workflow means "looked, nothing to report" -- it fires
# on every watched completion and on a schedule, not only on failures. The
# name says watchdog so a green line does not read as a failure having
# happened.
name: release watchdog
# Part of this fork's release pipeline; the product branch is oldos.

# A failed release is silent by default. The pipeline stops, the prerelease
# keeps whatever assets reached it, and nothing says so anywhere except a log
# nobody is watching. This turns every failure into an issue that carries the
# error annotations the failing jobs already emit, so the reason is readable
# without opening Actions at all.
#
# One deliberate blind spot: runs started by a push to the mirror branch
# (event push on master). Only a human unparking a workflows-review gate
# pushes master, with a PAT, which fires upstream's own push-to-master
# builds -- pure upstream code, never this fork's release signal.
#
# Pull request runs (Dependabot's weekly dependency bump firing the test
# and ABI gates) reach the backstop sweep as well. They become issues too:
# a failing check on a bot's PR notifies nobody. But they get their own
# title and label, because no release was blocked by them.
#
# Two triggers on purpose. workflow_run reacts within seconds, but GitHub never
# delivers the completion of a run started with the default token -- and that
# is how the platform builds and build-all are dispatched, so for them the
# schedule is the only path. Both paths are idempotent because the run id is
# part of the issue title.
#
# "sync with upstream" is deliberately absent from the watch list: it reports
# its own rebase conflicts with the commit list and the resolution commands,
# which is more useful than anything this workflow could reconstruct.

on:
  workflow_run:
    workflows:
      - release Linux
      - release macOS
      - release Windows
      - release Windows desktop (Avalonia UI)
      - release Windows x86
      - release all platforms
      - auto release
      - finalize release
    types: [ completed ]
  schedule:
    - cron: '23,53 * * * *'
  workflow_dispatch:

permissions:
  issues: write
  actions: read
  contents: read

concurrency:
  group: report-failure
  cancel-in-progress: false

jobs:
  report:
    name: open an issue for every unreported failure
    runs-on: ubuntu-latest
    steps:
      - name: Decide which runs to report
        id: collect
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          TRIGGER_RUN: ${{ github.event.workflow_run.id }}
          TRIGGER_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          TRIGGER_EVENT: ${{ github.event.workflow_run.event }}
          TRIGGER_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          set -euo pipefail
          # The conclusions that can mean a run did not do its job although
          # nobody chose that. startup_failure is a run GitHub could not
          # start: an invalid workflow file, or a GitHub fault at startup,
          # which the outages of 2026-08-26 and 2026-10-07 left in other
          # repositories. Such a run has no job, so no step of its own can
          # report it. cancelled is mostly a choice -- a person's, or a newer
          # run's in the same concurrency group -- but it is also how GitHub
          # ends a run whose job hit its time limit or waited 24 hours for a
          # runner (2026-10-14: microsoft/vscode 38516654837, and this fork's
          # 31559040403, a failure only because another job failed too). The
          # issue step tells the two apart by GitHub's annotation on the job.
          # timed_out is documented but unseen, here and in ten large public
          # repositories. Left out: action_required (a pull request run
          # waiting for approval).
          reportable='^(failure|startup_failure|timed_out|cancelled)$'
          if [[ "$EVENT" == "workflow_run" ]]; then
            if [[ ! "$TRIGGER_CONCLUSION" =~ $reportable ]]; then
              echo "The run ended ${TRIGGER_CONCLUSION:-with no conclusion}, nothing to report."
              echo "runs=" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            # The mirror blind spot from the header: upstream's builds fired
            # by the unparking push carry the same workflow names as the
            # fork's own, so match on the branch/event pair, not the name.
            if [[ "$TRIGGER_EVENT" == "push" && "$TRIGGER_BRANCH" == "master" ]]; then
              echo "Mirror push on master; upstream's code, not a product signal."
              echo "runs=" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "runs=${TRIGGER_RUN}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Backstop sweep: every run that ended in a reportable conclusion in
          # the last 24 hours, except this workflow's own runs and the
          # mirror-branch push runs (the blind spot from the header). The sync
          # reports its own failures, but from a step of its job; a sync run
          # that never started or was cut off had no such step, so only its
          # plain failures are left to it. Filtering happens in awk
          # rather than inside --jq, because the shell would have to escape
          # nested quotes and jq's join() refuses an array of numbers anyway.
          #
          # The window is keyed to the run's completion (updatedAt), not its
          # creation: a macOS run once sat queued for the full 24-hour limit,
          # was "in progress" through every sweep, and by the time it finally
          # failed its creation date had left the window. Completion events for
          # token-dispatched runs are also never delivered (GitHub recursion
          # prevention), so this sweep was its only chance -- and missed.
          #
          # 24 hours, not 6: the schedule asks for two sweeps an hour, GitHub
          # fires about eight a day, and 36 of the gaps between them exceeded
          # six hours (up to 11h46m, 2026-08-21 to 2026-10-14). A failure early
          # in such a gap would age out before any sweep saw it. The limit covers
          # the busiest 48 hours so far (427 runs), for a run that completes
          # long after it was created.
          since="$(date -u -d '24 hours ago' +%Y-%m-%dT%H:%M:%SZ)"
          runs="$(gh run list --limit 500 --json databaseId,conclusion,updatedAt,name,headBranch,event \
            --jq '.[] | [.databaseId, .conclusion, .updatedAt, .name, .headBranch, .event] | @tsv' \
            | awk -v since="$since" -v reportable="$reportable" -F'\t' '
                $2 ~ reportable && $3 > since && $4 != "release watchdog" &&
                !($2 == "failure" && $4 == "sync with upstream") &&
                !($5 == "master" && $6 == "push") { printf "%s ", $1 }')"
          echo "runs=${runs}" >> "$GITHUB_OUTPUT"
          echo "Runs to look at in the window: ${runs:-none}"

      - name: Open an issue for each failure
        if: steps.collect.outputs.runs != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RUNS: ${{ steps.collect.outputs.runs }}
        run: |
          set -euo pipefail

          gh label create release-failure --color D93F0B \
            --description "A release was blocked by a failing job" 2>/dev/null || true
          gh label create pr-check-failure --color FBCA04 \
            --description "A pull request check failed" 2>/dev/null || true

          # Every issue, read once. The duplicate check below must see the
          # issue of every run still in the 24-hour window, and a lasting
          # breakage can file more than a short list holds: with only the
          # newest 60, each sweep would file every run again once the window
          # held more than 60 failures (found by an adversarial run,
          # 2026-10-14). Without the list nothing can be ruled out, so fail
          # loudly rather than file the window twice; the next sweep retries.
          if ! issues_json="$(gh issue list --state all --limit 1000 --json number,title)" \
             || ! jq -e 'type == "array"' <<<"$issues_json" > /dev/null; then
            echo "::error::Listing the issues failed, so no run can be checked for an existing issue; the next sweep will retry them all."
            exit 1
          fi

          # One run's bad API answer must not silence the rest of the list:
          # skip it loudly and let the next sweep retry it (the 24-hour
          # window keeps it eligible). A silenced real failure is the one
          # unacceptable outcome for a watchdog.
          for run_id in $RUNS; do
            run_json="$(gh api "repos/${GH_REPO}/actions/runs/${run_id}")" || {
              echo "::warning::Fetching run ${run_id} failed; the next sweep will retry it."
              continue
            }
            # A run GitHub could not start can come without a name (and with
            # "BuildFailed" for a path), which would leave the title blank.
            name="$(jq -r '.name // ""' <<<"$run_json")"
            if [[ -n "$name" ]]; then
              the_workflow="the **${name}** workflow"
            else
              name="unnamed workflow"
              the_workflow="a workflow recorded without a name"
            fi
            conclusion="$(jq -r '.conclusion // ""' <<<"$run_json")"
            url="$(jq -r '.html_url' <<<"$run_json")"
            sha="$(jq -r '.head_sha' <<<"$run_json")"
            branch="$(jq -r '.head_branch' <<<"$run_json")"
            event="$(jq -r '.event' <<<"$run_json")"
            # `strings`: split() on a non-string path would abort the loop.
            workflow_file="$(jq -r '((.path | strings) // "") | split("/") | last // ""' <<<"$run_json")"
            started="$(jq -r '.run_started_at // .created_at' <<<"$run_json")"
            finished="$(jq -r '.updated_at' <<<"$run_json")"

            # The sweep catches pull_request runs too: Dependabot's weekly
            # bump fires Code Test and the ABI gate, and a red check on a
            # bot's PR notifies no one, so it still deserves an issue --
            # but not one that claims a release was blocked.
            if [[ "$event" == "pull_request" ]]; then
              label="pr-check-failure"
              pr_number="$(jq -r '(.pull_requests[0].number)? // empty' <<<"$run_json")"
              title="PR check failed: ${name} (run #${run_id})"
            else
              label="release-failure"
              pr_number=""
              title="Release blocked: ${name} (run #${run_id})"
            fi

            # Idempotent across both triggers and across repeated sweeps.
            existing="$(jq -r --arg key "(run #${run_id})" \
              '[.[] | select((.title // "") | contains($key)) | .number][0] // empty' <<<"$issues_json")"
            if [[ -n "$existing" ]]; then
              echo "Run ${run_id} is already reported in issue #${existing}."
              continue
            fi

            jobs_json="$(gh api "repos/${GH_REPO}/actions/runs/${run_id}/jobs?per_page=100")" || {
              echo "::warning::Fetching jobs for run ${run_id} failed; the next sweep will retry it."
              continue
            }

            # A cancelled run is somebody's choice -- a person's, or a newer
            # run's in a concurrency group -- unless GitHub cancelled a job
            # itself for running out of time. Its annotation on that job says
            # so ("The job has exceeded the maximum execution time of 6h0m0s",
            # or "... while awaiting a runner for 24h0m0s"); a person's cancel
            # reads "The run was canceled by @...". Only the former is filed.
            timeouts=""
            if [[ "$conclusion" == "cancelled" ]]; then
              unread=""
              while IFS=$'\t' read -r job_id job_name; do
                [[ -n "$job_id" ]] || continue
                if ! notes_json="$(gh api "repos/${GH_REPO}/check-runs/${job_id}/annotations?per_page=100")"; then
                  unread=1
                  continue
                fi
                note="$(jq -r '[.[]? | .message | strings | split("\n")[0] | select(test("exceeded the maximum execution time"))] | first // empty' \
                  <<<"$notes_json" || true)"
                if [[ -n "$note" ]]; then
                  timeouts+="- \`${job_name}\`: ${note}"$'\n'
                fi
              done <<<"$(jq -r '.jobs[]? | select(.conclusion == "cancelled") | "\(.id)\t\(.name)"' <<<"$jobs_json" || true)"
              if [[ -z "$timeouts" && -n "$unread" ]]; then
                echo "::warning::Fetching annotations for run ${run_id} failed; the next sweep will retry it."
                continue
              fi
              if [[ -z "$timeouts" ]]; then
                echo "Run ${run_id} was cancelled by a person or a newer run, not by a timeout; nothing to report."
                continue
              fi
            fi

            body_file="$(mktemp)"
            {
              if [[ "$event" == "pull_request" ]]; then
                printf '%s failed on a pull request run -- a check on incoming changes, not the release pipeline.\n\n' "${the_workflow^}"
              elif [[ "$conclusion" == "startup_failure" ]]; then
                printf 'GitHub could not start %s, so none of its jobs ran.\n\n' "$the_workflow"
              elif [[ -n "$timeouts" ]]; then
                printf '%s ran out of time, so this release was not published.\n\n' "${the_workflow^}"
              else
                printf '%s failed, so this release was not published.\n\n' "${the_workflow^}"
              fi
              printf '| | |\n| --- | --- |\n'
              printf '| Run | [#%s](%s) |\n' "$run_id" "$url"
              if [[ -n "$pr_number" ]]; then
                printf '| Pull request | #%s |\n' "$pr_number"
              fi
              printf '| Branch | `%s` |\n' "$branch"
              printf '| Commit | [`%s`](https://github.com/%s/commit/%s) |\n' "${sha:0:12}" "$GH_REPO" "$sha"
              printf '\n## What failed\n\n'
            } > "$body_file"

            jq -r '.jobs[]? | select(.conclusion == "failure") | "\(.id)\t\(.name)\t\(.html_url)"' <<<"$jobs_json" \
            | while IFS=$'\t' read -r job_id job_name job_url; do
                printf '### [%s](%s)\n\n' "$job_name" "$job_url" >> "$body_file"

                steps="$(jq -r --arg id "$job_id" \
                  '.jobs[]? | select(.id == ($id | tonumber)) | .steps[]? | select(.conclusion == "failure") | "- failed step: `\(.name)`"' \
                  <<<"$jobs_json" || true)"
                if [[ -n "$steps" ]]; then
                  printf '%s\n\n' "$steps" >> "$body_file"
                fi

                # The annotations are the jobs' own ::error:: messages, which
                # say what went wrong in one line each. Far more useful than a
                # link to a log where the reason is buried in setup output.
                notes="$(gh api "repos/${GH_REPO}/check-runs/${job_id}/annotations" \
                  --jq '.[] | select(.annotation_level == "failure") | "- " + (.message | split("\n")[0])' 2>/dev/null || true)"
                if [[ -n "$notes" ]]; then
                  printf '%s\n\n' "$notes" >> "$body_file"
                else
                  printf '_No annotations; open the job log._\n\n' >> "$body_file"
                fi
              done

            # A run can fail without a single failed job, and the loop above
            # then prints nothing. The Actions incident of 2026-10-07 did that
            # to every build of 7.25.5.2 -- the builds passed, the jobs due
            # next were never created -- and left this section empty in five
            # issues (#27-#31). GitHub states its reason only on the run page
            # ("Internal server error" that time), not in the REST API, so
            # point there and show how far the run got.
            #
            # A run GitHub could not start has no jobs at all, and its reason
            # is on the run page only as well -- in one of two forms, both
            # seen on public runs (2026-10-14), which call for opposite fixes.
            if [[ "$conclusion" == "startup_failure" ]]; then
              {
                printf 'GitHub could not start this run (conclusion `startup_failure`): it has no jobs and no log, and the API does not return the reason. The run page linked above states it. '
                printf '"Invalid workflow file" names the file and line GitHub rejected -- a reusable workflow it calls that was not found, for example. Every run of that workflow fails the same way until the file is fixed on `patches`, '
                printf 'and a run at an existing tag reads the file from that tag, so such a tag cannot be rebuilt: the next release carries the fix. '
                printf '"An unexpected error has occurred" is a GitHub fault at startup, which hit runs in other repositories on 2026-08-26 and 2026-10-07; once https://www.githubstatus.com shows no incident, run the workflow again -- a scheduled one runs again by itself.\n\n'
              } >> "$body_file"
            elif [[ -n "$timeouts" ]]; then
              # GitHub's own cancel for time: the run reads cancelled, not
              # failure, and no step of the job could report it.
              {
                printf 'GitHub cancelled this run itself: a job ran out of time, which ends a run as cancelled rather than failed. '
                printf 'A job that waited 24 hours for a runner got none -- a retired runner label or an outage; a job stopped at its time limit hung or ran too slow.\n\n'
                printf '%s\n' "$timeouts"
              } >> "$body_file"
            elif ! jq -e 'any(.jobs[]?; .conclusion == "failure")' <<<"$jobs_json" >/dev/null 2>&1; then
              job_list="$(jq -r '.jobs[]? | "- `\(.name)`: \(.conclusion // .status)"' <<<"$jobs_json" || true)"
              {
                printf 'No job in this run failed, so no job log holds the reason. GitHub shows its own reason on the run page linked above (the outage of 2026-10-07 left "Internal server error" there). '
                printf 'If the list below shows a cancelled job, a timeout, the 24-hour queue limit or a manual cancel stopped it. '
                printf 'For a GitHub error, look in https://www.githubstatus.com/history for an incident whose text covers %s to %s -- incidents are often opened after the impact.\n\n' "$started" "$finished"
                printf 'Jobs as GitHub recorded them:\n\n%s\n\n' "${job_list:-_none_}"
              } >> "$body_file"
            fi

            if [[ "$event" == "pull_request" ]]; then
              {
                printf '\n## What this means\n\n'
                printf 'No release was affected: this run checked a pull request, and nothing ships from a pull request until it merges.\n\n'
                printf 'Re-run the failed check from the pull request once the cause is addressed, or close the pull request to decline the change.\n\n'
                printf 'Close this issue once the check is green or the pull request is closed.\n'
              } >> "$body_file"
            else
              {
                printf '\n## What this means\n\n'
                # Release builds are dispatched at their tag, and the run
                # reports that tag as its branch. A push build of patches
                # has no tag, so the placeholder stays.
                tag='<tag>'
                version_re='^[0-9]+(\.[0-9]+){3}$'
                if [[ "$branch" =~ $version_re ]]; then
                  tag="$branch"
                fi
                # build-all only dispatches the five platform builds, one step
                # each, and its step name maps one to one onto the workflow
                # file. A "Trigger build <platform>" step that did not succeed
                # is a platform that most likely never started: failed is a
                # refused dispatch, skipped or cancelled one the job never
                # reached. A step that maps onto no known workflow file (a
                # platform upstream adds later) is named rather than dropped.
                # Should upstream rename the steps, nothing matches and the
                # generic text stays.
                refused_commands=""
                refused_unknown=""
                if [[ "$workflow_file" == "build-all.yml" ]]; then
                  while IFS=$'\t' read -r step_name platform; do
                    [[ -n "$step_name" ]] || continue
                    case "$platform" in
                      linux|osx|windows|windows-desktop|windows-x86)
                        refused_commands+="gh workflow run build-${platform}.yml --repo ${GH_REPO} --ref refs/tags/${tag} --field release_tag=${tag}"$'\n'
                        ;;
                      *)
                        refused_unknown+="${refused_unknown:+, }\`${step_name}\`"
                        ;;
                    esac
                  done <<<"$(jq -r '.jobs[]?.steps[]? | select(.conclusion != "success") | .name | strings
                      | select(startswith("Trigger build "))
                      | "\(.)\t\(ltrimstr("Trigger build ") | ascii_downcase | gsub(" +"; "-"))"' \
                    <<<"$jobs_json" || true)"
                fi
                # The command names the workflow that failed: it used to say
                # build-linux.yml whatever had failed, so pasting it rebuilt
                # the wrong platform.
                case "$workflow_file" in
                  # The five platform builds only: build-all.yml merely
                  # dispatches them, and dispatching it again would rebuild
                  # every platform on top of builds it has already started.
                  build-linux.yml|build-osx.yml|build-windows.yml|build-windows-desktop.yml|build-windows-x86.yml)
                    printf 'No artifact was uploaded for the affected platform: the release gate runs before the upload, '
                    printf 'so a failure here leaves the release incomplete rather than publishing something broken.\n\n'
                    printf 'If a newer full release has shipped since, the tag is superseded: close this issue rather than rebuild it. '
                    printf 'Otherwise, if the cause was transient, re-run the pipeline for the existing tag. '
                    printf 'Dispatch at the TAG, never at the branch: the branch is rebased hourly and may already contain code the release never claimed.\n\n'
                    printf '```bash\ngh workflow run %s --repo %s --ref refs/tags/%s --field release_tag=%s\n```\n\n' \
                      "$workflow_file" "$GH_REPO" "$tag" "$tag"
                    ;;
                  *)
                    if [[ -n "$refused_commands" || -n "$refused_unknown" ]]; then
                      printf 'The platform builds below were not dispatched -- GitHub refused them, or the job stopped before their step -- so they most likely never started and their assets are missing from the release. '
                      printf 'The platforms dispatched successfully need nothing, and running this workflow again would build those twice.\n\n'
                      printf 'If a newer full release has shipped since, the tag is superseded: close this issue rather than rebuild it. '
                      printf 'Otherwise list what already runs at the tag first -- a server error or a timeout can hide a dispatch that did start a build:\n\n'
                      printf '```bash\ngh run list --repo %s --branch %s\n```\n\n' "$GH_REPO" "$tag"
                      if [[ -n "$refused_commands" ]]; then
                        printf 'Then start each platform below that is missing from that list, at the tag:\n\n'
                        printf '```bash\n%s```\n\n' "$refused_commands"
                      fi
                      if [[ -n "$refused_unknown" ]]; then
                        printf 'Not dispatched, and with no workflow file known to this watchdog: %s. Start each of those workflows at the tag by hand.\n\n' "$refused_unknown"
                      fi
                    elif [[ "$workflow_file" != *.yml && "$workflow_file" != *.yaml ]]; then
                      # A run GitHub could not start may not say which workflow
                      # it was, and a malformed path says nothing either.
                      printf 'GitHub did not record which workflow this run belongs to, so no rebuild command applies. '
                      printf 'Check what the workflows of this commit left behind (a tag, a prerelease, a promotion) before running any of them again.\n\n'
                    else
                      # No command here on purpose: a re-run is wrong for some
                      # of these (auto release re-run after it created the tag
                      # finds nothing new and never starts the builds).
                      printf 'This run is not one of the platform builds, so no rebuild command applies. '
                      printf 'The sections above show how far it got; check what it left behind (a tag, a prerelease, a promotion) before running it again.\n\n'
                    fi
                    ;;
                esac
                printf 'Close this issue once the release completes.\n'
              } >> "$body_file"
            fi

            gh issue create --title "$title" --label "$label" --body-file "$body_file"
            echo "Reported run ${run_id}."
          done
